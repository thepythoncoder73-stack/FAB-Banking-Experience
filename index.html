
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAB ATM Banking</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4C5B8F, #202B50);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .atm {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            color: #24345d;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            font-size: 38px;
            font-weight: bold;
            color: #4C5B8F;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .balance {
            background: #4C5B8F;
            color: white;
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .balance p {
            margin: 0 0 10px;
        }

        .balance h2 {
            margin: 0;
            font-size: 32px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd1df;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
            outline-color: #4C5B8F;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 14px 10px;
            border: none;
            border-radius: 9px;
            background: #4C5B8F;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #303e6b;
            transform: translateY(-2px);
        }

        .deposit {
            background: #23845b;
        }

        .deposit:hover {
            background: #176641;
        }

        .exit {
            background: #b83b48;
        }

        .exit:hover {
            background: #8e2733;
        }

        .secret {
            background: #7451a6;
        }

        .secret:hover {
            background: #57377f;
        }

        #message {
            margin-top: 22px;
            padding: 15px;
            border-radius: 9px;
            background: #eef0f8;
            color: #24345d;
            line-height: 1.6;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 380px) {
            .atm {
                padding: 20px;
            }

            .balance h2 {
                font-size: 27px;
            }

            button {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="atm">
        <div class="logo">FAB</div>
        <div class="subtitle">First Abu Dhabi Bank ATM</div>

        <div class="balance">
            <p>Available Balance</p>
            <h2 id="balance">$1,000.00</h2>
        </div>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount ($)"
            min="0.01"
            step="0.01"
        >

        <div class="buttons">
            <button onclick="checkBalance()">Check Balance</button>
            <button onclick="withdrawMoney()">Withdraw</button>
            <button class="deposit" onclick="depositMoney()">Deposit</button>
            <button class="exit" onclick="exitATM()">Exit</button>
            <button class="secret" onclick="secretCode()"
                    style="grid-column: 1 / -1;">
                Secret FAB Bonus
            </button>
        </div>

        <div id="message" role="status" aria-live="polite">
            Welcome to FAB ATM banking!
            Please select an option.
        </div>

        <div class="footer">
            FAB ATM Demo • Practice Banking Project
        </div>
    </main>

    <script>
        let money = 1000;
        let exited = false;
        let bonusClaimed = false;

        const balanceDisplay = document.getElementById("balance");
        const message = document.getElementById("message");
        const amountInput = document.getElementById("amount");

        function updateBalance() {
            balanceDisplay.textContent = "$" + money.toFixed(2);
        }

        function getAmount() {
            const value = amountInput.valueAsNumber;

            if (!Number.isFinite(value) || value <= 0) {
                message.textContent = "Invalid amount. Please enter a positive number.";
                return null;
            }

            return Math.round(value * 100) / 100;
        }

        function checkBalance() {
            if (exited) return;

            message.textContent =
                "You currently have $" + money.toFixed(2) +
                " in your account.";
        }

        function withdrawMoney() {
            if (exited) return;

            const amount = getAmount();
            if (amount === null) return;

            if (amount > money) {
                message.textContent =
                    "Insufficient funds! You cannot withdraw more than your balance.";
                return;
            }

            money = Math.round((money - amount) * 100) / 100;
            updateBalance();

            message.textContent =
                "Withdrawal successful!\nYou withdrew $" +
                amount.toFixed(2) +
                ".\nMoney left in your account: $" +
                money.toFixed(2);

            amountInput.value = "";
        }

        function depositMoney() {
            if (exited) return;

            const amount = getAmount();
            if (amount === null) return;

            money = Math.round((money + amount) * 100) / 100;
            updateBalance();

            message.textContent =
                "Deposit successful!\nYou deposited $" +
                amount.toFixed(2) +
                ".\nYour new balance is $" +
                money.toFixed(2);

            amountInput.value = "";
        }

        function exitATM() {
            message.textContent =
                "*** Thank you for using FAB BANKING SERVICES! ***\n" +
                "We hope to see you again.";

            exited = true;
            amountInput.disabled = true;

            document.querySelectorAll("button").forEach(button => {
                button.disabled = true;
                button.style.opacity = "0.6";
                button.style.cursor = "not-allowed";
            });
        }

        function secretCode() {
            if (exited) return;

            if (bonusClaimed) {
                message.textContent =
                    "You have already claimed your FAB bonus!";
                return;
            }

            const code = prompt("Enter your secret code:");

            if (code === null) return;

            if (code.trim().toLowerCase() === "fab") {
                money += 1000;
                bonusClaimed = true;
                updateBalance();

                message.textContent =
                    "Secret unlocked!\n" +
                    "You officially earned $1,000!\n" +
                    "Your new balance is $" + money.toFixed(2) + ".";
            } else {
                message.textContent =
                    "Invalid secret code. Please try again.";
            }
        }
    </script>

</body>
</html>
